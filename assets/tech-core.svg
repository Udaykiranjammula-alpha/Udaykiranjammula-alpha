<svg xmlns="http://www.w3.org/2000/svg" width="370" height="280" viewBox="0 0 370 280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>

    <!-- Radar Sweep Angular Gradient -->
    <linearGradient id="sweep-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dcfff" stop-opacity="0"/>
      <stop offset="60%" stop-color="#7dcfff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0.32"/>
    </linearGradient>

    <!-- Core Telemetry Polygon Gradient -->
    <linearGradient id="poly-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Glow Filter for Active Nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="370" height="280" rx="12" fill="url(#bg-grad)" stroke="#414868" stroke-width="1.5"/>

  <!-- Terminal Window Chrome / Header -->
  <path d="M 0 12 A 12 12 0 0 1 12 0 H 358 A 12 12 0 0 1 370 12 V 34 H 0 Z" fill="#24283b"/>
  <line x1="0" y1="34" x2="370" y2="34" stroke="#414868" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="18" cy="17" r="4.5" fill="#f7768e"/>
  <circle cx="32" cy="17" r="4.5" fill="#e0af68"/>
  <circle cx="46" cy="17" r="4.5" fill="#9ece6a"/>

  <!-- Title & Mode -->
  <text x="62" y="21" fill="#7dcfff" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600">uday@sys:~$ arch.radar --telemetry</text>
  <text x="278" y="21" fill="#565f89" font-family="'Fira Code', 'Courier New', monospace" font-size="9">SYS_CORE v2.4</text>

  <!-- Radar Geometry Container (Center: 185, 138) -->
  <g id="radar-grid">
    <!-- Fine Background Grid -->
    <g stroke="#1f2335" stroke-width="0.8" opacity="0.6">
      <path d="M 40 50 H 330 M 40 94 H 330 M 40 138 H 330 M 40 182 H 330 M 40 226 H 330"/>
      <path d="M 65 35 V 240 M 125 35 V 240 M 185 35 V 240 M 245 35 V 240 M 305 35 V 240"/>
    </g>

    <!-- Concentric Circular Grids -->
    <circle cx="185" cy="138" r="78" fill="none" stroke="#414868" stroke-width="1.2"/>
    <circle cx="185" cy="138" r="54" fill="none" stroke="#292e42" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="185" cy="138" r="30" fill="none" stroke="#292e42" stroke-width="1"/>

    <!-- Concentric Hexagonal Rings -->
    <!-- Outer Hexagon (R=78, pointy-topped) -->
    <polygon points="185,60 252.5,99 252.5,177 185,216 117.5,177 117.5,99" fill="none" stroke="#292e42" stroke-width="1" stroke-dasharray="2,3"/>
    <!-- Mid Hexagon (R=54, pointy-topped) -->
    <polygon points="185,84 231.8,111 231.8,165 185,192 138.2,165 138.2,111" fill="none" stroke="#1f2335" stroke-width="0.8"/>

    <!-- Crosshair Axis Lines -->
    <!-- Primary Cardinal Axes -->
    <line x1="97" y1="138" x2="273" y2="138" stroke="#7aa2f7" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/>
    <line x1="185" y1="50" x2="185" y2="226" stroke="#7aa2f7" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/>

    <!-- Diagonal Axes -->
    <line x1="130" y1="83" x2="240" y2="193" stroke="#292e42" stroke-width="0.8"/>
    <line x1="240" y1="83" x2="130" y2="193" stroke="#292e42" stroke-width="0.8"/>

    <!-- Crosshair Reticle Ticks on Axis -->
    <line x1="185" y1="58" x2="185" y2="62" stroke="#7aa2f7" stroke-width="1.5"/>
    <line x1="185" y1="214" x2="185" y2="218" stroke="#7aa2f7" stroke-width="1.5"/>
    <line x1="105" y1="138" x2="109" y2="138" stroke="#7aa2f7" stroke-width="1.5"/>
    <line x1="261" y1="138" x2="265" y2="138" stroke="#7aa2f7" stroke-width="1.5"/>

    <!-- Range Ring Labels -->
    <text x="187" y="81" fill="#565f89" font-family="'Fira Code', 'Courier New', monospace" font-size="7">0.75</text>
    <text x="187" y="105" fill="#565f89" font-family="'Fira Code', 'Courier New', monospace" font-size="7">0.50</text>
    <text x="187" y="129" fill="#565f89" font-family="'Fira Code', 'Courier New', monospace" font-size="7">0.25</text>
  </g>

  <!-- Radar Sweep Effect -->
  <g id="radar-sweep">
    <path d="M 185 138 L 240 83 A 78 78 0 0 0 185 60 Z" fill="url(#sweep-grad)"/>
    <line x1="185" y1="138" x2="240" y2="83" stroke="#7dcfff" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
    <animateTransform attributeName="transform" type="rotate" from="0 185 138" to="360 185 138" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- Core Telemetry Polygon (#bb9af7 fill with opacity) -->
  <!-- Calculated telemetry points:
       Top-Left (Low-Level C++): (136.0, 89.0)   ~0.88 radius
       Top-Right (Distributed ML): (232.0, 91.0) ~0.85 radius
       Bottom-Right (Forensic IO): (230.0, 185.0) ~0.84 radius
       Bottom-Left (Embedded RTOS): (138.0, 185.0) ~0.84 radius
  -->
  <g id="telemetry-polygon">
    <polygon points="136,89 232,91 230,185 138,185" fill="url(#poly-grad)" stroke="#bb9af7" stroke-width="1.8"/>

    <!-- Node Points & Glowing Vertex Indicators -->
    <circle cx="136" cy="89" r="3.5" fill="#7dcfff" stroke="#1a1b26" stroke-width="1"/>
    <circle cx="136" cy="89" r="6" fill="#7dcfff" fill-opacity="0.2"/>

    <circle cx="232" cy="91" r="3.5" fill="#7dcfff" stroke="#1a1b26" stroke-width="1"/>
    <circle cx="232" cy="91" r="6" fill="#7dcfff" fill-opacity="0.2"/>

    <circle cx="230" cy="185" r="3.5" fill="#7dcfff" stroke="#1a1b26" stroke-width="1"/>
    <circle cx="230" cy="185" r="6" fill="#7dcfff" fill-opacity="0.2"/>

    <circle cx="138" cy="185" r="3.5" fill="#7dcfff" stroke="#1a1b26" stroke-width="1"/>
    <circle cx="138" cy="185" r="6" fill="#7dcfff" fill-opacity="0.2"/>
  </g>

  <!-- Systems Engineering Nodes & Taxonomy -->

  <!-- Node 2: [ LOW-LEVEL C++ ] (Top-Left) -->
  <g id="node-lowlevel">
    <!-- Bus Trace -->
    <polyline points="106,68 122,68 136,89" fill="none" stroke="#414868" stroke-width="1.2" stroke-dasharray="2,2"/>
    <circle cx="106" cy="68" r="2.5" fill="#7aa2f7"/>
    <text x="16" y="64" fill="#7aa2f7" font-family="'Fira Code', 'Courier New', monospace" font-size="9.5" font-weight="700">[ LOW-LEVEL C++ ]</text>
    <text x="16" y="76" fill="#a9b1d6" font-family="'Fira Code', 'Courier New', monospace" font-size="8">C++20 · POSIX · SIMD</text>
    <text x="16" y="87" fill="#565f89" font-family="'Fira Code', 'Courier New', monospace" font-size="7.5">SCORE: 0.98</text>
  </g>

  <!-- Node 1: [ DISTRIBUTED ML ] (Top-Right) -->
  <g id="node-distml">
    <!-- Bus Trace -->
    <polyline points="264,68 248,68 232,91" fill="none" stroke="#414868" stroke-width="1.2" stroke-dasharray="2,2"/>
    <circle cx="264" cy="68" r="2.5" fill="#bb9af7"/>
    <text x="236" y="64" fill="#bb9af7" font-family="'Fira Code', 'Courier New', monospace" font-size="9.5" font-weight="700">[ DISTRIBUTED ML ]</text>
    <text x="236" y="76" fill="#a9b1d6" font-family="'Fira Code', 'Courier New', monospace" font-size="8">INT8 · 4x-ESP32 · RING</text>
    <text x="236" y="87" fill="#565f89" font-family="'Fira Code', 'Courier New', monospace" font-size="7.5">LAT: 54.2ms</text>
  </g>

  <!-- Node 4: [ EMBEDDED RTOS ] (Bottom-Left) -->
  <g id="node-rtos">
    <!-- Bus Trace -->
    <polyline points="106,208 122,208 138,185" fill="none" stroke="#414868" stroke-width="1.2" stroke-dasharray="2,2"/>
    <circle cx="106" cy="208" r="2.5" fill="#9ece6a"/>
    <text x="16" y="204" fill="#9ece6a" font-family="'Fira Code', 'Courier New', monospace" font-size="9.5" font-weight="700">[ EMBEDDED RTOS ]</text>
    <text x="16" y="216" fill="#a9b1d6" font-family="'Fira Code', 'Courier New', monospace" font-size="8">XTENSA LX7 · DMA · SPI</text>
    <text x="16" y="227" fill="#565f89" font-family="'Fira Code', 'Courier New', monospace" font-size="7.5">PWR: 2.38W</text>
  </g>

  <!-- Node 3: [ FORENSIC IO ] (Bottom-Right) -->
  <g id="node-forensics">
    <!-- Bus Trace -->
    <polyline points="264,208 248,208 230,185" fill="none" stroke="#414868" stroke-width="1.2" stroke-dasharray="2,2"/>
    <circle cx="264" cy="208" r="2.5" fill="#7dcfff"/>
    <text x="236" y="204" fill="#7dcfff" font-family="'Fira Code', 'Courier New', monospace" font-size="9.5" font-weight="700">[ FORENSIC IO ]</text>
    <text x="236" y="216" fill="#a9b1d6" font-family="'Fira Code', 'Courier New', monospace" font-size="8">ENTROPY · MMAP · HASH</text>
    <text x="236" y="227" fill="#565f89" font-family="'Fira Code', 'Courier New', monospace" font-size="7.5">THROUGHPUT: 15.2GB/s</text>
  </g>

  <!-- Central Node: [ KERNEL / ARCH ] -->
  <g id="node-kernel-arch">
    <!-- Chamfered Hexagonal HUD Center Badge -->
    <path d="M 132 127 L 238 127 L 246 138 L 238 149 L 132 149 L 124 138 Z" fill="#1f2335" stroke="#7aa2f7" stroke-width="1.2"/>
    <text x="185" y="142" fill="#c0caf5" font-family="'Fira Code', 'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">[ KERNEL / ARCH ]</text>
  </g>

  <!-- Card Footer / Status & Philosophy Bar -->
  <g id="card-footer">
    <line x1="14" y1="244" x2="356" y2="244" stroke="#414868" stroke-width="1"/>
    <!-- Systems Indicator (Green light) -->
    <circle cx="24" cy="257" r="3.5" fill="#9ece6a"/>
    <text x="34" y="260" fill="#9ece6a" font-family="'Fira Code', 'Courier New', monospace" font-size="9" font-weight="600">SYS: ACTIVE</text>
    <!-- Philosophy Text -->
    <text x="185" y="260" fill="#7aa2f7" font-family="'Fira Code', 'Courier New', monospace" font-size="9.5" font-weight="600" text-anchor="middle">HARDWARE-AWARE · DETERMINISTIC</text>
    <text x="312" y="260" fill="#565f89" font-family="'Fira Code', 'Courier New', monospace" font-size="8.5">0 CLOUD</text>
    <!-- Sub-status line -->
    <text x="185" y="272" fill="#565f89" font-family="'Fira Code', 'Courier New', monospace" font-size="8" text-anchor="middle">XTENSA LX7 · POSIX RT · INT8 SIMD · MMAP ZERO-COPY</text>
  </g>
</svg>