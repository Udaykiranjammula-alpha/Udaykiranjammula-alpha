name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Udaykiranjammula-alpha
          outputs: |
            assets/github-snake-dark.svg?palette=github-dark
            assets/github-snake.svg?palette=github

      - name: Commit snake SVGs when changed
        run: |
          if git diff --quiet -- assets/github-snake-dark.svg assets/github-snake.svg; then
            echo "No snake changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake-dark.svg assets/github-snake.svg
          git commit -m "chore: update contribution snake animation"
          git push
