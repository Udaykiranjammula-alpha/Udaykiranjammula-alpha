name: Update contribution heatmap

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap.py
      - name: Commit generated updates when changed
        run: |
          if git diff --quiet -- data/contributions.json assets/contrib-heatmap.svg; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contrib-heatmap.svg
          git commit -m "chore: update contribution heatmap"
          git push
